[tool.poetry]
packages = [{ include = "shuvi" }]

[tool.poetry.group.dev.dependencies]
pytest-asyncio = "^1.3.0"
python-dotenv = ">=1.0.1,<1.1.0"

[project]
name = "shuvi"
version = "0.1.3"
description = "A lightweight async agent loop for building AI companions with Python."
authors = [{ name = "phillychi3", email = "phillychi3@gmail.com" }]
license = { text = "MIT License" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pydantic (>=2.12.5,<3.0.0)", "hydrogen-ai (>=0.2.0,<0.3.0)"]

[project.urls]
Homepage = "https://github.com/waifu-lab/Shuvi"
Repository = "https://github.com/waifu-lab/Shuvi"


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test"]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
lint.select = ["ASYNC", "ARG", "B", "C", "C4", "E", "F", "Q", "W", "I"]

lint.ignore = ["F401"]

lint.unfixable = ["F401"]

line-length = 120
